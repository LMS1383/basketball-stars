<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>篮球传奇殿堂 | NBA巨星风采</title>
    <!-- 引入 Google Fonts 提升字体质感 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 (免费图标库) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            color: #f0f2f5;
            line-height: 1.5;
            scroll-behavior: smooth;
        }

        /* 背景篮球纹理效果 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/basketball.png');
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            position: relative;
            z-index: 2;
        }

        /* 头部区域 */
        .hero {
            text-align: center;
            margin-bottom: 3rem;
            padding: 1.5rem 0.5rem;
            border-bottom: 2px solid rgba(255, 140, 0, 0.3);
        }
        .hero h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 3.5rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #FFB347, #FF7E05);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .hero p {
            font-size: 1.2rem;
            color: #ccd6f0;
            margin-top: 0.8rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
        .hero i {
            color: #ff8c00;
            margin: 0 5px;
        }

        /* 筛选栏 + 搜索 */
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            background: rgba(20, 28, 44, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            padding: 0.8rem 1.8rem;
            margin-bottom: 2.5rem;
            border: 1px solid rgba(255, 140, 0, 0.3);
        }
        .filter-group {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: transparent;
            border: 1px solid #3b4a6b;
            color: #e2e8f0;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #ff7e05;
            border-color: #ff7e05;
            color: #0a0f1e;
            box-shadow: 0 4px 12px rgba(255, 126, 5, 0.3);
        }
        .search-box {
            display: flex;
            align-items: center;
            background: #0f1422;
            border-radius: 40px;
            padding: 0.3rem 1rem;
            border: 1px solid #2d3a5e;
        }
        .search-box i {
            color: #ff8c66;
            margin-right: 8px;
        }
        .search-box input {
            background: transparent;
            border: none;
            padding: 0.6rem 0;
            font-size: 1rem;
            color: white;
            width: 180px;
            outline: none;
        }
        .search-box input::placeholder {
            color: #8e9bb5;
        }

        /* 明星卡片网格 */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 2rem;
            margin-top: 1rem;
        }

        /* 卡片设计 */
        .card {
            background: rgba(18, 25, 45, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 140, 0, 0.2);
            box-shadow: 0 20px 30px -12px rgba(0,0,0,0.4);
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 35px -12px rgba(0,0,0,0.6);
            border-color: rgba(255, 126, 5, 0.6);
        }
        .card-img {
            height: 230px;
            background-size: cover;
            background-position: center top;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            padding: 1rem;
        }
        .card-img span {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            font-weight: bold;
            font-size: 0.8rem;
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            color: #ffbc6e;
            font-family: monospace;
        }
        .card-content {
            padding: 1.5rem;
        }
        .player-name {
            font-size: 1.8rem;
            font-weight: 700;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 1px;
            margin-bottom: 0.2rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .player-name h3 {
            font-size: 1.7rem;
        }
        .position {
            background: #ff7e0522;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #ffae6e;
            border: 0.5px solid #ff8c33;
        }
        .team {
            color: #b9c7e0;
            margin: 0.5rem 0;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .team i {
            width: 20px;
            color: #ffa559;
        }
        .stats {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
            font-size: 0.85rem;
            background: #0b1120;
            padding: 0.6rem;
            border-radius: 24px;
        }
        .stats div {
            flex: 1;
            text-align: center;
        }
        .stats .stat-value {
            font-weight: 800;
            font-size: 1.2rem;
            color: #ffaa55;
        }
        .desc {
            font-size: 0.85rem;
            color: #b9c7e0;
            margin-top: 0.6rem;
            border-top: 1px dashed #2f3b5e;
            padding-top: 0.8rem;
        }
        .footer-note {
            text-align: center;
            margin-top: 3rem;
            color: #7a86a3;
            font-size: 0.8rem;
            border-top: 1px solid #1e2a44;
            padding-top: 1.8rem;
        }
        @media (max-width: 650px) {
            .controls {
                flex-direction: column;
                border-radius: 30px;
                align-items: stretch;
            }
            .filter-group {
                justify-content: center;
            }
            .search-box {
                justify-content: space-between;
            }
            .hero h1 {
                font-size: 2.5rem;
            }
        }
        /* 无结果提示 */
        .no-result {
            text-align: center;
            padding: 4rem;
            font-size: 1.3rem;
            background: rgba(0,0,0,0.3);
            border-radius: 60px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

<div class="container">

        <h1><i class="fas fa-basketball-ball"></i> 篮坛巨星殿堂 <i class="fas fa-trophy"></i></h1>

    </div>

    <div class="controls">

            <button class="filter-btn" data-filter="中锋">📏 中锋</button>
        </div>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="搜索球星姓名...">
        </div>
    </div>

    <div class="players-grid" id="playersGrid">
        <!-- 动态渲染js -->
    </div>
    <div class="footer-note">
        <i class="fas fa-globe"></i> 致敬传奇 | 数据参考NBA官方及篮球名人堂 | 热爱永不熄

</div>

            image: "https://images.unsplash.com/photo-1579952363873-27f3bade9f55?q=80&w=1935&auto=format"
        },
        {
            id: 12,
            name: "阿伦·艾弗森",
            engName: "Allen Iverson",
            position: "控球后卫",
            category: ["传奇", "后卫"],

    // 补充更美观的备用图片确保每个卡片都有视觉（有些unsplash可能偏抽象，但风格一致）
    // 确保不破坏体验，加后备样式
    function renderCards(players) {
        const grid = document.getElementById('playersGrid');
        if(!players.length) {
            grid.innerHTML = `<div class="no-result"><i class="fas fa-dizzy"></i> 没有找到相关球星，试试其他关键词或筛选条件～</div>`;
            return;
        }
        let html = '';
        players.forEach(player => {
            // 处理个性分类tag显示
            let posClass = player.position;
            let categoryBadges = '';
            if(player.category.includes('传奇')) categoryBadges = '<span class="position" style="background:#c96e1f40;">🏅 传奇</span>';
            else if(player.category.includes('现役')) categoryBadges = '<span class="position" style="background:#2c5f2d40;">🔥 现役</span>';
            else categoryBadges = '<span class="position">⭐ 球星</span>';

            // 动态背景图片 （确保图片可以加载，使用data中image）
            const imgUrl = player.image || 'https://images.unsplash.com/photo-1546519638-68e109498ffc?q=80&w=2070&auto=format';
            html += `
                <div class="card" data-name="${player.name.toLowerCase()}" data-categories="${player.category.join(',')}">
                    <div class="card-img" style="background-image: linear-gradient(0deg, rgba(0,0,0,0.6), rgba(0,0,0,0.2)), url('${imgUrl}');">
                        <span><i class="fas fa-medal"></i> ${player.rings ? player.rings.split('×')[0] : '0'}冠</span>
                    </div>
                    <div class="card-content">
                        <div class="player-name">
                            <h3>${player.name}</h3>
                            ${categoryBadges}
                        </div>
                        <div class="team"><i class="fas fa-shirt"></i> ${player.team}</div>
                        <div class="stats">
                            <div><div class="stat-value">${player.points}</div><div>场均得分</div></div>
                            <div><div class="stat-value">${player.mvps}</div><div>常规赛MVP</div></div>
                            <div><div class="stat-value">${player.rings}</div><div>总冠军</div></div>
                        </div>
                        <div class="desc">
                            <i class="fas fa-quote-left"></i> ${player.desc}<br>
                            <span style="font-size:0.7rem;">🏀 ${player.position} | ${player.engName}</span>
                        </div>
                    </div>
                </div>
            `;
        });
        grid.innerHTML = html;
    }

    let currentFilter = "all";
    let currentSearch = "";

    function filterAndSearch() {
        let filtered = [...playersData];
        // 类别筛选
        if(currentFilter !== "all") {
            filtered = filtered.filter(player => player.category.includes(currentFilter));
        }
        // 搜索关键字
        if(currentSearch.trim() !== "") {
            const kw = currentSearch.trim().toLowerCase();
            filtered = filtered.filter(player => player.name.toLowerCase().includes(kw) || player.engName.toLowerCase().includes(kw));
        }
        renderCards(filtered);
    }

    // 绑定筛选按钮事件
    const btns = document.querySelectorAll('.filter-btn');
    btns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            btns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filterVal = btn.getAttribute('data-filter');
            currentFilter = filterVal;
            filterAndSearch();
        });
    });

    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', (e) => {
        currentSearch = e.target.value;
        filterAndSearch();
    });

    // 初始化加载全部
    renderCards(playersData);
</script>
